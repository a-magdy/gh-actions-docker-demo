name: Test Composite

on:
  workflow_dispatch:
  workflow_call:

env:
  DOCKER_REGISTRY_URL: ghcr.io

permissions:
  contents: read
  packages: read

# Forks: the remote `uses: a-magdy/gh-actions-docker-demo/...@main` refs below are
# literals (`uses:` cannot use expressions). Change them to your owner/repo.
jobs:
  run-composite-action-succeeds:
    name: Composite (Succeeds)
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKER_REGISTRY_URL }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: a-magdy/gh-actions-docker-demo/test-gh-docker/composite@main
        with:
          image: ${{ env.DOCKER_REGISTRY_URL }}/${{ github.repository }}/ubuntu
