name: Test Docker-in-Docker

on:
  workflow_dispatch:
  workflow_call:

env:
  DOCKER_REGISTRY_URL: ghcr.io

permissions:
  contents: read
  packages: read

# Forks: the remote `uses: a-magdy/gh-actions-docker-demo/...@main` refs below are
# literals (`uses:` cannot use expressions). Change them to your owner/repo.
jobs:
  dind-run-image-fails:
    name: DinD - Image (Fails)
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: ghcr.io/${{ github.repository }}/dind
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --privileged
    steps:
      - name: Docker Registry Login
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKER_REGISTRY_URL }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Image Action
        uses: a-magdy/gh-actions-docker-demo/test-gh-docker/image@main

  dind-run-dockerfile-fails:
    name: DinD - Dockerfile (Fails)
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: ghcr.io/${{ github.repository }}/dind
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --privileged
    steps:
      - name: Docker Registry Login
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKER_REGISTRY_URL }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Dockerfile Action
        uses: a-magdy/gh-actions-docker-demo/test-gh-docker/dockerfile@main

  dind-composite-action-succeeds:
    name: DinD - Composite (Succeeds)
    runs-on: ubuntu-latest
    needs: [dind-run-image-fails, dind-run-dockerfile-fails]
    container:
      image: ghcr.io/${{ github.repository }}/dind
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --privileged
    steps:
      - uses: actions/checkout@v6

      - name: Docker Registry Login
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKER_REGISTRY_URL }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Test image
        shell: bash
        run: docker run --rm --platform linux/amd64 ${{ env.DOCKER_REGISTRY_URL }}/${{ github.repository }}/ubuntu echo "Hello from Docker in DinD"
