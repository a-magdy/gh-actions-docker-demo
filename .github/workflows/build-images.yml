name: Build and Push Images

on:
  push:
    branches: [main]
    paths:
      - "images/**"
  workflow_dispatch:
  workflow_call:

env:
  DOCKER_REGISTRY_URL: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKER_REGISTRY_URL }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push ubuntu image
        uses: docker/build-push-action@v7
        with:
          context: ./images/ubuntu
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.DOCKER_REGISTRY_URL }}/${{ github.repository }}/ubuntu:latest
          cache-from: type=gha,scope=ubuntu
          cache-to: type=gha,mode=max,scope=ubuntu

      - name: Build and push dind image
        uses: docker/build-push-action@v7
        with:
          context: ./images/dind
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.DOCKER_REGISTRY_URL }}/${{ github.repository }}/dind:latest
          cache-from: type=gha,scope=dind
          cache-to: type=gha,mode=max,scope=dind
